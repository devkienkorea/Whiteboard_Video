[project]
name = "whiteboard-video"
version = "0.1.0"
description = "Tự động làm video whiteboard tay vẽ (TikTok, giọng Việt), chạy local"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "imageio-ffmpeg>=0.5",
    "piper-tts>=1.3",
    "mlx-whisper>=0.4",
    "mflux>=0.23",
    "vieneu>=3.8",
    "mlx-lm>=0.32",
    "mlx-vlm>=0.7",  # Qwen3.6 nhìn ảnh để định vị vật thể
    "pillow<13",  # Pillow 13 không chạy trên Python 3.11
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # không quét models/ (ACE-Step có test riêng)
